# Portal Frontend (Vue + Nginx) — backend-design §5.2
#   빌드 산출물을 Nginx로 정적 서빙. SPA라 nginx가 index.html 폴백을 담당한다.
#   이미지는 k3s containerd에 import (imagePullPolicy: Never).
apiVersion: v1
kind: Service
metadata:
  name: portal-frontend
  namespace: hpc-portal
spec:
  selector:
    app: portal-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-frontend
  namespace: hpc-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-frontend
  template:
    metadata:
      labels:
        app: portal-frontend
    spec:
      containers:
        - name: frontend
          image: hpc-portal-frontend:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet: { path: /index.html, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /index.html, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 256Mi }

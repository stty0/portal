# 외부 노출 — Traefik (backend-design §5.2)
#
# **호스트 포트 9080/9443을 쓴다.** 이 서버의 80/443은 기존 nginx가 점유하고 있고
# osmo.dt-hpc.net·keycloak.dt-hpc.net을 서비스 중이라 건드리지 않는다.
# 포트는 kube-system의 HelmChartConfig(50-traefik-ports.yaml)에서 hostPort로 연다.
#
# 라우팅 (같은 도메인·같은 포트에서 두 서비스를 가른다):
#   /api/**  → portal-backend  (REST + Swagger)
#   그 외    → portal-frontend (Vue SPA)
#
# TLS는 certbot 인증서(/etc/letsencrypt/live/www.dt-hpc.net)를 Secret으로 넣어 쓴다.
# **인증서 갱신 시 Secret도 갱신해야 한다** — certbot-deploy-hook.sh 참조.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: hpc-portal
spec:
  redirectScheme:
    scheme: https
    port: "9443"
    permanent: true
---
# HTTP(9080) → HTTPS(9443)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal-http
  namespace: hpc-portal
spec:
  entryPoints: [web]
  routes:
    - match: Host(`www.dt-hpc.net`)
      kind: Rule
      middlewares:
        - name: https-redirect
      services:
        - name: portal-frontend
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal-api
  namespace: hpc-portal
spec:
  entryPoints: [websecure]
  routes:
    # 백엔드가 노출하는 경로는 전부 `/api` 아래에 있다
    # (`/api/v1/...`, Swagger `/api/v1/docs`, OpenAPI `/api/v1/openapi.json`).
    # `/healthz`는 K8s probe 전용이라 외부로 열지 않는다.
    # priority를 명시해 SPA catch-all보다 반드시 먼저 매칭되게 한다.
    - match: Host(`www.dt-hpc.net`) && PathPrefix(`/api`)
      kind: Rule
      priority: 100
      services:
        - name: portal-backend
          port: 8000
    # 나머지 전부는 SPA. vue-router가 history 모드라 /jobs 같은 경로로 직접
    # 들어와도 프론트엔드 nginx가 index.html을 돌려줘야 한다(폴백은 nginx.conf).
    - match: Host(`www.dt-hpc.net`)
      kind: Rule
      priority: 1
      services:
        - name: portal-frontend
          port: 80
  tls:
    secretName: dt-hpc-tls

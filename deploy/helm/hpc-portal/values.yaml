# Slurm HPC 포털 — Helm values
#
# 이 차트는 `deploy/k8s/`의 매니페스트를 그대로 옮긴 것이다. 동작을 바꾸지 않았고,
# 손으로 만들던 Secret 생성 절차만 차트가 흡수했다.

nameOverride: ""
fullnameOverride: ""

image:
  backend:
    repository: hpc-portal-backend
    tag: ""            # 비우면 Chart.appVersion
    # k3s containerd에 `ctr images import`로 넣는 구성이라 pull하지 않는다.
    # 레지스트리를 쓰면 IfNotPresent로 바꾼다.
    pullPolicy: Never
  frontend:
    repository: hpc-portal-frontend
    tag: ""
    pullPolicy: Never

# --- Portal DB (backend-design §5.3) ---------------------------------------
mysql:
  enabled: true
  image: mysql:8.4
  database: portal
  username: portal
  # 비우면 설치할 때 난수로 만들고 **업그레이드 때 기존 값을 그대로 유지한다**.
  # 여기에 값을 적으면 그 값이 이긴다.
  rootPassword: ""
  password: ""
  # 이미 만들어 둔 Secret을 쓰려면 이름만 적는다(키: root-password·username·password).
  existingSecret: ""
  storage:
    size: 10Gi
    # **비우면 클러스터 기본 StorageClass를 쓴다**(k3s는 local-path) — 새 클러스터에서
    # 그냥 설치된다. 아래 `storageClass.create`로 Retain SC를 만들었다면 그 이름을 적는다.
    # 존재하지 않는 이름을 적으면 PVC가 Pending에서 멈추고 MySQL이 뜨지 않는다 —
    # 그 조합은 렌더 단계에서 막는다(templates/_helpers.tpl).
    className: ""
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

# --- 세션·캐시·분산락 (backend-design §5.4) --------------------------------
redis:
  enabled: true
  image: redis:7.4-alpine
  password: ""          # 비우면 난수 생성 + 업그레이드 시 유지
  existingSecret: ""    # 키: password
  # 영속성 없음(emptyDir) — 재시작 시 전 사용자 재로그인. 설계상 허용되는 손실이다.
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }

backend:
  replicaCount: 1
  # 스키마를 먼저 맞춘 뒤 앱이 뜬다. replica를 늘리면 Job/Helm hook으로 분리해야 한다(§5.5).
  migrate: true
  scheduler: false
  jwtSecret: ""         # 비우면 난수 생성 + 업그레이드 시 유지
  setupToken: ""        # 〃
  # Secret에 그대로 실리는 값. `PORTAL_SECRET_*`(자격증명)은 여기 두지 말 것 —
  # values 파일에 평문으로 남는다. 아래 "런타임 등록분" 설명 참조.
  env:
    PORTAL_AD_TLS_VERIFY: "false"
    # ⚠ **평문 http로 열 때만 "false"로 바꾼다.** 기본이 true라 브라우저가 http에서
    # 쿠키를 버리고, 화면은 뜨는데 **로그인만 조용히 실패한다**.
    # TLS Secret이 없어도 Traefik 기본 인증서(자체서명)로 https가 열리므로 그때는 true여도 된다.
    PORTAL_COOKIE_SECURE: "true"
  # 앱 아이콘이 놓이는 **노드의 디렉터리** (A-OP-02). 관리 화면에서 업로드하므로 쓰기가
  # 필요하고, 컨테이너 UID(10001) 소유여야 한다.
  #   sudo mkdir -p /home/.portal/app-icons && sudo chown 10001:10001 /home/.portal/app-icons
  # **비우면 마운트하지 않는다** — 목록은 비고 업로드는 422로 끊긴다(조용히 사라지는
  # emptyDir보다 낫다). 아이콘을 안 쓸 거면 비워 두어도 된다.
  appIconHostPath: ""
  # 통째로 직접 관리하는 Secret이 있으면 이름만 적는다. 이때 차트는 Secret을 만들지 않는다.
  existingSecret: ""
  # 로그인 노드 호스트키 (U-FM-01). 없으면 SSH 접속을 거부한다.
  #   ssh-keyscan <로그인노드> 결과를 그대로 붙여 넣는다.
  sshKnownHosts: ""
  existingSshKnownHostsSecret: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

frontend:
  replicaCount: 1
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 500m, memory: 256Mi }

# --- 외부 노출 (Traefik IngressRoute) --------------------------------------
ingress:
  enabled: true
  host: www.dt-hpc.net
  # 같은 도메인·포트에서 경로로 가른다: /api/** → 백엔드, 나머지 → SPA.
  apiPrefix: /api
  entryPoints:
    web: web
    websecure: websecure
  # 인증서 Secret 이름(`kubernetes.io/tls`, 키는 `tls.crt`·`tls.key`).
  # **차트가 만들지 않는다** — 개인키가 values 파일에 평문으로 남기 때문이다.
  #   kubectl -n <ns> create secret tls <이름> --cert=fullchain.pem --key=privkey.pem
  # 비워 두면 Traefik 기본 인증서(자체서명)로 뜬다 — 접속은 되고 브라우저 경고만 난다.
  # Let's Encrypt를 쓰면 갱신 때 Secret도 함께 갱신해야 한다(deploy/k8s/certbot-deploy-hook.sh).
  tlsSecretName: dt-hpc-tls

# k3s 내장 Traefik의 hostPort를 바꾼다. **클러스터 전역(kube-system) 설정이라 기본은 꺼둔다** —
# 이 노드의 80/443은 기존 nginx가 점유하고 있어 9080/9443으로 연다.
traefik:
  configure: false
  webHostPort: 9080
  websecureHostPort: 9443

# PVC를 지워도 데이터가 남게 하는 StorageClass. **클러스터 전역 객체다** —
# 여러 릴리스가 공유하므로 처음 한 번만 만든다.
storageClass:
  create: false
  name: local-path-retain
  provisioner: rancher.io/local-path
  reclaimPolicy: Retain

# 개발 편의용 외부 접근. **운영에서는 켜지 않는다** — 클러스터 밖에 DB·Redis가 열린다.
dev:
  nodePorts:
    enabled: false
    mysql: 30306
    redis: 30379

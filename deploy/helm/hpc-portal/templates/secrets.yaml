{{/*
  자격증명. **차트가 값을 만들되, 한 번 만든 값은 지킨다.**

  손으로 `kubectl create secret`을 치던 절차를 흡수한 부분이다. 위험한 지점이 둘 있다.

  1. **비밀번호를 업그레이드마다 새로 만들면 안 된다.** MySQL 볼륨에는 옛 비밀번호가
     남아 있어 파드가 뜨지 못한다. `lookup`으로 기존 값을 먼저 읽는다.

  2. **`portal-backend-env`에는 차트가 모르는 키가 들어 있다.** 클러스터 자격증명
     (`PORTAL_SECRET_CLUSTER_13_SLURM_JWT` 등)은 운영 중에 손으로 넣는다 —
     `EnvSecretStore.put()`이 프로세스 안에만 두고 영속화는 배포 수단의 몫이기 때문이다
     (`core/secrets.py`). 그래서 **기존 키를 통째로 물려받고** 차트가 아는 키만 덮어쓴다.
     이 병합이 없으면 `helm upgrade` 한 번에 모든 클러스터 연결이 끊긴다.
*/}}
{{- if and .Values.mysql.enabled (not .Values.mysql.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hpc-portal.mysqlSecretName" . }}
  labels: {{- include "hpc-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.mysql.username | quote }}
  password: {{ include "hpc-portal.mysqlPassword" . | quote }}
  root-password: {{ include "hpc-portal.mysqlRootPassword" . | quote }}
---
{{- end }}
{{- if and .Values.redis.enabled (not .Values.redis.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hpc-portal.redisSecretName" . }}
  labels: {{- include "hpc-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ include "hpc-portal.redisPassword" . | quote }}
---
{{- end }}
{{- if not .Values.backend.existingSecret }}
{{- $name := include "hpc-portal.backendSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $keep := dict }}
{{- if $existing }}
  {{- range $k, $v := ($existing.data | default dict) }}
    {{- $_ := set $keep $k ($v | b64dec) }}
  {{- end }}
{{- end }}
{{- $mysqlPassword := include "hpc-portal.mysqlPassword" . }}
{{- $redisPassword := include "hpc-portal.redisPassword" . }}
{{- $fullname := include "hpc-portal.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "hpc-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* 운영 중에 손으로 넣은 키를 먼저 깔고, 차트가 아는 키로 덮어쓴다. */}}
  {{- range $k, $v := $keep }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range $k, $v := $.Values.backend.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  PORTAL_JWT_SECRET: {{ include "hpc-portal.jwtSecret" . | quote }}
  PORTAL_SETUP_TOKEN: {{ include "hpc-portal.setupToken" . | quote }}
  PORTAL_SCHEDULER_ENABLED: {{ .Values.backend.scheduler | quote }}
  PORTAL_SSH_KNOWN_HOSTS: /etc/portal/ssh/known_hosts
  {{- if .Values.mysql.enabled }}
  PORTAL_DATABASE_URL: {{ printf "mysql+pymysql://%s:%s@%s-mysql:3306/%s?charset=utf8mb4" .Values.mysql.username $mysqlPassword $fullname .Values.mysql.database | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  PORTAL_REDIS_URL: {{ printf "redis://:%s@%s-redis:6379/0" $redisPassword $fullname | quote }}
  {{- end }}
---
{{- end }}
{{- if and .Values.backend.sshKnownHosts (not .Values.backend.existingSshKnownHostsSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hpc-portal.knownHostsSecretName" . }}
  labels: {{- include "hpc-portal.labels" . | nindent 4 }}
type: Opaque
stringData:
  known_hosts: |-
{{ .Values.backend.sshKnownHosts | indent 4 }}
{{- end }}

{{- if .Values.mysql.enabled }}
{{- $fullname := include "hpc-portal.fullname" . }}
{{- $secret := include "hpc-portal.mysqlSecretName" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mysql
  labels: {{- include "hpc-portal.labels" . | nindent 4 }}
spec:
  clusterIP: None  # StatefulSet용 headless
  selector:
    app.kubernetes.io/name: {{ include "hpc-portal.name" . }}
    app.kubernetes.io/component: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
{{- if .Values.dev.nodePorts.enabled }}
---
# **개발 편의용이다.** 클러스터 밖에 DB가 열린다 — 운영에서는 끈다.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mysql-nodeport
  labels: {{- include "hpc-portal.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ include "hpc-portal.name" . }}
    app.kubernetes.io/component: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      nodePort: {{ .Values.dev.nodePorts.mysql }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-mysql
  labels: {{- include "hpc-portal.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hpc-portal.name" . }}
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        {{- include "hpc-portal.labels" . | nindent 8 }}
        app.kubernetes.io/component: mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: root-password } }
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: username } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $secret }}, key: password } }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" -e "SELECT 1"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources: {{- toYaml .Values.mysql.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- $sc := include "hpc-portal.mysqlStorageClass" . }}
        {{- if $sc }}
        storageClassName: {{ $sc }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mysql.storage.size }}
{{- end }}

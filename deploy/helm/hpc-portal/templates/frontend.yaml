{{- $fullname := include "hpc-portal.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-frontend
  labels: {{- include "hpc-portal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "hpc-portal.name" . }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-frontend
  labels: {{- include "hpc-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hpc-portal.name" . }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "hpc-portal.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "hpc-portal.frontendImage" . }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet: { path: /index.html, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /index.html, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}

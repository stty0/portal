[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-portal-backend"
version = "0.1.0"
description = "Slurm HPC Portal — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # multipart 업로드(U-FM-02). FastAPI의 Form/File은 이게 없으면 기동 시점에 죽는다.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    # HTTP 인터랙티브 앱 프록시가 **클라이언트로** 쓴다(U-IA-01 Jupyter 커널 채널).
    # uvicorn[standard]가 딸려 설치해 주지만, 앱 코드가 쓰는 것은 명시한다 —
    # 전이 의존성에 기대면 uvicorn 옵션이 바뀔 때 조용히 사라진다.
    "websockets>=13",
    "redis>=5.0",
    "ldap3>=2.9",
    "paramiko>=3.4",
    "apscheduler>=3.10",
    "pymysql>=1.1",
    "scpv2-sdk>=0.2.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
